<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca</title>
  <!-- Icono y nombre al guardarla en la pantalla de inicio -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F8D9DC">
  <meta name="apple-mobile-web-app-title" content="Celia">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="tema.css">
</head>
<body>
  <main>
    <header id="portada">
      <svg class="dibujo" viewBox="0 0 120 90" aria-hidden="true">
        <circle cx="86" cy="30" r="18" fill="#F5D58A"/>
        <circle cx="92" cy="26" r="15" fill="#F6CFD3"/>
        <g fill="#FFFFFF">
          <circle cx="40" cy="62" r="14"/><circle cx="58" cy="54" r="18"/><circle cx="78" cy="64" r="12"/>
          <rect x="30" y="62" width="58" height="14" rx="7"/>
        </g>
        <g fill="#F5D58A">
          <path d="M22 18l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
          <path d="M108 60l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z"/>
        </g>
        <path d="M14 44c0-3 4-4 5-1 1-3 5-2 5 1 0 3-5 6-5 6s-5-3-5-6z" fill="#E98C7A"/>
      </svg>
      <h1 id="titulo-biblioteca"></h1>
      <p id="cifra">Cargando cuentos…</p>
      <p id="lema">Cada cuento es un tesoro ♡</p>
      <p id="resumen" class="suave"></p>
    </header>

    <form id="acceso" hidden>
      <p class="caja-titulo">Esta estantería es de la familia</p>
      <p class="suave">Escribe la contraseña de la casa para entrar. Solo te la pediremos una vez.</p>
      <label class="campo">Contraseña de la casa
        <input id="clave" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
      </label>
      <p id="acceso-aviso" class="aviso" role="alert"></p>
      <button id="acceso-entrar" type="submit" class="primario">Entrar</button>
    </form>

    <form id="buscador" role="search">
      <input id="consulta" type="search" placeholder="Busquemos si ya lo tiene…" autocomplete="off" enterkeyhint="search">
      <button id="camara" type="button" aria-label="Escanear el código de barras">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>Escanear</span>
      </button>
    </form>

    <div id="escaneado" hidden></div>
    <div id="veredicto" hidden></div>
    <button id="cotillea" type="button" hidden>Ver la estantería</button>
    <div id="resultados"></div>
  </main>

  <div id="aviso-flotante" role="status" aria-live="polite" hidden></div>

  <div id="escaner" class="capa" hidden>
    <div class="caja">
      <p class="caja-titulo">Dale la vuelta al cuento</p>
      <p class="suave">Busca el código de barras de atrás y enfócalo con calma.</p>
      <div id="lector"></div>
      <p id="escaner-aviso" class="suave"></p>
      <button id="escaner-cerrar" type="button" class="secundario">Ahora no</button>
    </div>
  </div>

  <div id="formulario" class="capa" hidden>
    <form id="form" class="caja" novalidate>
      <p id="form-titulo" class="caja-titulo">¡Apúntalo!</p>
      <p id="form-sub" class="suave"></p>
      <div id="form-libro">
        <div class="opciones">
          <label><input type="radio" name="estado" value="Reservado"><span>Se lo voy a regalar</span></label>
          <label><input type="radio" name="estado" value="En casa"><span>Ya vive en casa</span></label>
        </div>
        <label class="campo">Título del cuento<input name="titulo" maxlength="200" autocomplete="off"></label>
        <label class="campo">Autor<input name="autor" maxlength="200" autocomplete="off"></label>
        <label id="campo-isbn" class="campo">ISBN <span class="suave">· opcional, el resto se rellena solito</span><input name="isbn" inputmode="numeric" maxlength="17" autocomplete="off"></label>
      </div>
      <label id="form-nombre" class="campo">Tu nombre <span class="suave">· opcional, solo lo verán en casa</span><input name="nombre" maxlength="60" autocomplete="given-name"></label>
      <p id="form-aviso" class="aviso"></p>
      <button id="form-enviar" type="submit" class="primario">Apuntarlo ♡</button>
      <button id="form-cerrar" type="button" class="secundario">Ahora no</button>
    </form>
  </div>

  <script src="config.js"></script>
  <script src="textos.js"></script>
  <script src="datos-ejemplo.js"></script>
  <script src="app.js"></script>
</body>
</html>
